name: Validate JSON files

on:
  push:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate JSON files
    runs-on: ubuntu-slim
    steps:
      - name: Checkout files
        uses: actions/checkout@v7
      - name: Validate JSON files
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: ./challenges.schema.json
          files: ./challenges.json