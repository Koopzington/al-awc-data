name: Validate JSON files

on:
  push:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate JSON files
    runs-on: ubuntu-slim
    steps:
      - name: Validate JSON files
        uses: dsanders11/json-schema-validate-action@v2.0.0
        with:
          schema: ./challenges.schema.json
          files: ./challenges.json